<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tracks</title>

  <script src="https://unpkg.com/wavesurfer.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background-color: white;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background: center top no-repeat white;
      background-image: url('https://classicvinyl.github.io/audio-player/uous-bg.jpg');
      background-size: contain;
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.3);
      z-index: -1;
    }

    .playlist-container {
      background-color: #000;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 2rem;
    }

    .playlist-title {
      color: grey;
      font-weight: bold;
      font-size: 2rem;
    }

    .track-item {
      cursor: pointer;
      padding: 0.5rem 1rem;
      color: white;
    }

    .track-item.active {
      background: grey;
    }

    .waveform-container {
      height: 130px;
      margin-bottom: 10px;
    }

    .comment-box {
      width: 100%;
      background: #111;
      color: #ccc;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px;
      margin-top: 4px;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
<div class="p-6">
  <h2 class="playlist-title mb-4">TRACKS</h2>
  <div id="playlist-selector"></div>
  <div id="active-playlist"></div>
</div>

<script>

const BASE_URL = 'https://uous-audio-player.s3.eu-west-1.amazonaws.com/';
let wavesurfer = null;

/* ===== COMMENTS ===== */
function saveComment(track, i, val) {
  localStorage.setItem(track + "_c" + i, val);
}
function loadComment(track, i) {
  return localStorage.getItem(track + "_c" + i) || "";
}

/* ===== LOAD FILES ===== */
async function loadFiles() {
  const res = await fetch(BASE_URL + 'files.json', {cache: 'no-cache'});
  return res.json();
}

/* ===== PLAYLIST ===== */
function createPlaylist(name, tracks) {

  const container = document.createElement('div');
  container.className = 'playlist-container';

  const title = document.createElement('h2');
  title.className = 'playlist-title mb-4';
  title.textContent = name;
  container.appendChild(title);

  const waveform = document.createElement('div');
  waveform.className = 'waveform-container';
  container.appendChild(waveform);

  const list = document.createElement('div');
  container.appendChild(list);

  let currentIndex = -1;

  function loadTrack(index) {

    if (wavesurfer) {
      wavesurfer.destroy();
    }

    currentIndex = index;

    wavesurfer = WaveSurfer.create({
      container: waveform,
      waveColor: 'white',
      progressColor: 'orange',
      height: 130
    });

    wavesurfer.load(BASE_URL + tracks[index].file);

    wavesurfer.on('finish', () => {
      if (index + 1 < tracks.length) {
        loadTrack(index + 1);
      }
    });

    updateActive();
  }

  function updateActive() {
    list.querySelectorAll('.track-item').forEach((el, i) => {
      el.classList.toggle('active', i === currentIndex);
    });
  }

  tracks.forEach((track, i) => {

    const wrapper = document.createElement('div');

    const row = document.createElement('div');
    row.className = 'track-item';
    row.textContent = track.title;

    row.onclick = () => loadTrack(i);

    wrapper.appendChild(row);

    // COMMENTS
    for (let c = 1; c <= 4; c++) {
      const input = document.createElement('input');
      input.className = 'comment-box';
      input.placeholder = 'comment ' + c;

      input.value = loadComment(track.title, c);

      input.addEventListener('input', () => {
        saveComment(track.title, c, input.value);
      });

      wrapper.appendChild(input);
    }

    list.appendChild(wrapper);
  });

  return container;
}

/* ===== INIT ===== */
async function init() {
  const files = await loadFiles();

  const selector = document.getElementById('playlist-selector');
  const active = document.getElementById('active-playlist');

  files.forEach(p => {

    const btn = document.createElement('div');
    btn.className = 'track-item';
    btn.textContent = p.playlist;

    btn.onclick = () => {
      active.innerHTML = '';
      active.appendChild(createPlaylist(p.playlist, p.tracks));
    };

    selector.appendChild(btn);
  });
}

init();

</script>
</body>
</html>
