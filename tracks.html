<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>playlist notes</title>

<style>

/* =========================
   INDEX.HTML STYLE BACKGROUND
========================= */

body {
  margin: 0;
  background-color: white;
  overflow-x: hidden;
  position: relative;
}

/* background image */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: center top no-repeat white;
  background-image: url('https://classicvinyl.github.io/audio-player/uous-bg.jpg');
  background-size: contain;
  z-index: -2;
  pointer-events: none;
}

@media (max-width: 768px) {
  body::before {
    background-size: cover;
  }
}

/* grey overlay */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.3);
  z-index: -1;
  pointer-events: none;
}

/* =========================
   LAYOUT (UNCHANGED STRUCTURE)
========================= */

.wrap {
  padding: 20px;
}

/* playlist container matches index aesthetic */
.playlist {
  background-color: #000;
  padding: 1rem;
  border-radius: 0.5rem;
  margin-bottom: 2rem;
}

/* playlist title EXACT index style */
.playlist-title {
  color: grey;
  font-weight: bold;
  font-size: 2rem;
  margin: 0 0 1rem 0;
}

/* track block */
.track {
  padding: 10px;
  border-radius: 0.375rem;
  color: white;
  border-bottom: 1px solid #111;
}

.track:hover {
  background-color: #3c2a36;
}

/* track name */
.track-name {
  font-size: 13px;
  margin-bottom: 8px;
  color: #fff;
}

/* =========================
   COMMENTS (MATCH DARK UI)
========================= */

.comment {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid #222;
  color: #ccc;
  padding: 6px 0;
  margin: 4px 0;
  font-size: 12px;
  outline: none;
}

.comment:focus {
  border-bottom: 1px solid grey;
}

</style>
</head>

<body>
<div class="wrap" id="app"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://mgeeyekokpymfwtkngai.supabase.co";
const SUPABASE_KEY = "sb_publishable_K2O4oYM7el8cSXnqZrB7EQ_WDXYWkn_";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const BASE_URL = "https://uous-audio-player.s3.eu-west-1.amazonaws.com/";

async function loadFiles() {
  const res = await fetch(BASE_URL + "files.json", { cache: "no-cache" });
  return res.json();
}

function makeTrackId(playlist, file) {
  return `${playlist}/${file}`;
}

async function loadComments(track) {
  const { data } = await supabase
    .from("comments")
    .select("*")
    .eq("track", track);

  return data || [];
}

async function saveComment(track, line, value) {
  await supabase
    .from("comments")
    .upsert(
      {
        track,
        line,
        comment: value
      },
      { onConflict: "track,line" }
    );
}

function createInput(track, line, existing) {
  const input = document.createElement("input");
  input.className = "comment";
  input.value = existing?.comment || "";
  input.placeholder = `comment ${line + 1}`;

  input.addEventListener("change", () => {
    saveComment(track, line, input.value);
  });

  return input;
}

async function render() {
  const app = document.getElementById("app");
  const data = await loadFiles();

  for (const playlist of data) {

    const playlistDiv = document.createElement("div");
    playlistDiv.className = "playlist";

    const title = document.createElement("div");
    title.className = "playlist-title";
    title.textContent = playlist.playlist;

    playlistDiv.appendChild(title);

    for (const track of playlist.tracks) {

      const trackId = makeTrackId(playlist.playlist, track.file);
      const comments = await loadComments(trackId);

      const trackDiv = document.createElement("div");
      trackDiv.className = "track";

      const name = document.createElement("div");
      name.className = "track-name";
      name.textContent = track.title;

      trackDiv.appendChild(name);

      for (let i = 0; i < 4; i++) {
        const existing = comments.find(c => c.line === i);
        trackDiv.appendChild(createInput(trackId, i, existing));
      }

      playlistDiv.appendChild(trackDiv);
    }

    app.appendChild(playlistDiv);
  }
}

render();
</script>

</body>
</html>
