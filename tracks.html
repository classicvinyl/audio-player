<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>uous private</title>

  <script src="https://unpkg.com/wavesurfer.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

  <style>
body {
  margin: 0;
  background-color: white;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('https://classicvinyl.github.io/audio-player/uous-bg.jpg');
  background-size: contain;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.3);
  z-index: -1;
}

.playlist-container { background:#000; padding:1rem; border-radius:0.5rem; margin-bottom:2rem; }
.playlist-title { color:grey; font-size:2rem; font-weight:bold; }

.track-item {
  display:flex;
  justify-content:space-between;
  padding:0.5rem 1rem;
  color:white;
  cursor:pointer;
}

.track-item:hover { background:#3c2a36; }
.track-item.active { background:grey; }

.duration { color:#bbb; font-size:0.85rem; }

.waveform-container { height:130px; background:#000; border-radius:0.5rem; }

.comment-block {
  margin-top:0.5rem;
  padding-left:1rem;
  border-left:1px solid #333;
}

.comment-line {
  width:100%;
  background:transparent;
  border:none;
  border-bottom:1px solid #222;
  color:white;
  font-size:0.85rem;
  padding:0.4rem 0;
  outline:none;
}

.comment-line:focus { border-bottom:1px solid grey; }
  </style>
</head>

<body>
<div class="p-6">

<h2 class="playlist-title mb-2">PLAYLISTS</h2>
<div id="playlist-selector"></div>
<div id="active-playlist"></div>

</div>

<script>
const BASE_URL = 'https://uous-audio-player.s3.eu-west-1.amazonaws.com/';

/* =========================
   SINGLE SUPABASE CLIENT
========================= */
const SUPABASE_URL = "https://mgeeyekokpymfwtkngai.supabase.co";
const SUPABASE_KEY = "sb_publishable_K2O4oYM7el8cSXnqZrB7EQ_WDXYWkn_";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let globalWavesurfer = null;

async function loadFiles() {
  const res = await fetch(BASE_URL + 'files.json', { cache: 'no-cache' });
  return res.json();
}

/* =========================
   PLAYLIST RENDER
========================= */
function createPlaylist(name, tracks) {

  const container = document.createElement('div');
  container.className = 'playlist-container';

  const title = document.createElement('div');
  title.className = 'playlist-title';
  title.textContent = name;
  container.appendChild(title);

  const trackList = document.createElement('div');

  tracks.forEach((track) => {

    const trackId = `${name}/${track.file}`;

    const row = document.createElement('div');
    row.className = 'track-item';

    const label = document.createElement('span');
    label.textContent = track.title;

    const duration = document.createElement('span');
    duration.className = 'duration';
    duration.textContent = '--:--';

    row.appendChild(label);
    row.appendChild(duration);

    const commentBlock = document.createElement('div');
    commentBlock.className = 'comment-block';

    /* SAFE LOAD (no crash) */
    setTimeout(async () => {
      try {
        const { data } = await supabase
          .from("comments")
          .select("*")
          .eq("track", trackId);

        const existing = data || [];

        for (let i = 0; i < 4; i++) {

          const input = document.createElement('input');
          input.className = 'comment-line';

          const found = existing.find(c => c.line === i);
          input.value = found ? found.comment : '';
          input.placeholder = `comment ${i + 1}`;

          input.addEventListener('change', async () => {
            await supabase
              .from("comments")
              .upsert({
                track: trackId,
                line: i,
                comment: input.value
              }, { onConflict: "track,line" });
          });

          commentBlock.appendChild(input);
        }

      } catch (e) {
        console.log("Supabase comment load error:", e);
      }
    }, 0);

    row.addEventListener('click', () => {
      loadTrack(track.file);
    });

    trackList.appendChild(row);
    trackList.appendChild(commentBlock);

    const audio = new Audio(BASE_URL + track.file);
    audio.addEventListener('loadedmetadata', () => {
      duration.textContent =
        Math.floor(audio.duration / 60) + ':' +
        String(Math.floor(audio.duration % 60)).padStart(2,'0');
    });

  });

  container.appendChild(trackList);
  return container;
}

/* =========================
   WAVESURFER
========================= */
async function loadTrack(file) {
  if (globalWavesurfer) globalWavesurfer.destroy();

  globalWavesurfer = WaveSurfer.create({
    container: document.createElement('div'),
    waveColor: 'white',
    progressColor: 'orange',
    height: 130
  });

  globalWavesurfer.load(BASE_URL + file);
}

/* =========================
   INIT
========================= */
async function init() {
  const files = await loadFiles();
  const selector = document.getElementById('playlist-selector');
  const active = document.getElementById('active-playlist');

  files.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'track-item';
    btn.textContent = p.playlist;

    btn.onclick = () => {
      active.innerHTML = '';
      active.appendChild(createPlaylist(p.playlist, p.tracks));
    };

    selector.appendChild(btn);
  });
}

init();
</script>

</body>
</html>
