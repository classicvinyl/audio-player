<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>playlist notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body {
    margin: 0;
    background: #0b0b0b;
    color: #d0d0d0;
    font-family: sans-serif;
  }

  .wrap {
    padding: 20px;
  }

  .playlist {
    margin-bottom: 40px;
  }

  .playlist-title {
    font-size: 18px;
    margin: 20px 0 10px;
    color: #ffffff;
  }

  .track {
    padding: 10px;
    border-bottom: 1px solid #222;
  }

  .track-name {
    font-size: 14px;
    margin-bottom: 8px;
    color: #aaa;
  }

  .comment {
    width: 100%;
    background: #111;
    border: 1px solid #222;
    color: #ccc;
    padding: 6px;
    margin: 4px 0;
    font-size: 12px;
  }
</style>

</head>
<body>

<div class="wrap" id="app"></div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://mgeeyekokpymfwtkngai.supabase.co";
const SUPABASE_KEY = "sb_publishable_K2O4oYM7el8cSXnqZrB7EQ_WDXYWkn_";

const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const BASE_URL = "https://uous-audio-player.s3.eu-west-1.amazonaws.com/";

async function loadFiles() {
  const res = await fetch(BASE_URL + "files.json", { cache: "no-cache" });
  return res.json();
}

async function loadComments(trackId) {
  const { data } = await supabase
    .from("track_comments")
    .select("*")
    .eq("track_id", trackId);

  return data || [];
}

async function saveComment(trackId, i, value) {
  await supabase.from("track_comments").upsert({
    track_id: trackId,
    line_index: i,
    content: value
  });
}

function makeTrackId(playlist, file) {
  return playlist + "/" + file;
}

function renderCommentBox(trackId, existing, i) {
  const input = document.createElement("input");
  input.className = "comment";
  input.value = existing?.content || "";
  input.placeholder = "comment " + (i + 1);

  input.addEventListener("change", async () => {
    await saveComment(trackId, i, input.value);
  });

  return input;
}

async function render() {
  const app = document.getElementById("app");
  const data = await loadFiles();

  for (const playlist of data) {

    const p = document.createElement("div");
    p.className = "playlist";

    const title = document.createElement("div");
    title.className = "playlist-title";
    title.textContent = playlist.playlist;

    p.appendChild(title);

    for (const track of playlist.tracks) {

      const trackId = makeTrackId(playlist.playlist, track.file);
      const comments = await loadComments(trackId);

      const t = document.createElement("div");
      t.className = "track";

      const name = document.createElement("div");
      name.className = "track-name";
      name.textContent = track.title;

      t.appendChild(name);

      for (let i = 0; i < 4; i++) {
        const c = comments.find(x => x.line_index === i);
        t.appendChild(renderCommentBox(trackId, c, i));
      }

      p.appendChild(t);
    }

    app.appendChild(p);
  }
}

render();
</script>

</body>
</html>
