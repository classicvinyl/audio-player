<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>playlist notes</title>

  <style>

body {
  margin: 0;
  background-color: white; /* matches the image background */
  overflow-x: hidden;
  position: relative;
}

/* Background image layer */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: center top no-repeat white;
  background-image: url('https://classicvinyl.github.io/audio-player/uous-bg.jpg');
  background-size: contain;
  z-index: -2;
  pointer-events: none;
}

/* Mobile override */
@media (max-width: 768px) {
  body::before {
    background-size: cover;
  }
}

/* Grey overlay layer */
body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.3); /* same grey everywhere */
  z-index: -1;
  pointer-events: none;
}

    .playlist-container {
      background-color: #000;
      padding: 1rem;
      border-radius: 0.5rem;
      border-color: #808080;
      margin-bottom: 2rem;
    }
    .playlist-title {
      color: grey;
      font-weight: bold;
      font-size: 2rem;
      margin: 0;
    }
    .track-item {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      color: white;
      transition: background-color 0.3s;
    }
    .track-item:hover {
      background-color: #3c2a36;
    }
    .track-item.active {
      background-color: grey;
      font-weight: bold;
    }
    .duration {
      color: #bbb;
      font-size: 0.85rem;
      min-width: 40px;
      text-align: right;
      margin-left: 0.5rem;
    }
    .waveform-container {
      position: relative;
      height: 130px;
      margin-bottom: 0.5rem;
      background-color: #000;
      border-radius: 0.5rem;
      border-color: #808080;
      transition: opacity 0.3s ease;
    }
    .error-message {
      color: #ff6b6b;
      font-weight: bold;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .play-pause-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: orange;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .play-icon, .pause-icon {
      fill: white;
      width: 30px;
      height: 30px;
    }
    .playlist-link {
      color: white;
      cursor: pointer;
      padding: 0.25rem 0;
      display: block;
    }

    /* MOBILE RESPONSIVENESS ADJUSTMENTS */
    .playlist-container .flex.flex-wrap {
      flex-wrap: nowrap !important;
      align-items: center;
      gap: 0.5rem;
    }
    .playlist-container .playlist-title {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 0.5rem;
    }
    .playlist-container .play-pause-button {
      flex: 0 0 auto;
    }
    .track-item .truncate {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 480px) {
      .playlist-container .playlist-title {
        font-size: 1.25rem;
      }
      .playlist-container .play-pause-button {
        width: 44px;
        height: 44px;
      }
    }
  </style>

</head>

<body>
<div class="wrap" id="app"></div>

<script type="module">

import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

/* =========================
   SUPABASE (UNCHANGED LOGIC)
========================= */

const SUPABASE_URL = "https://mgeeyekokpymfwtkngai.supabase.co";
const SUPABASE_KEY = "sb_publishable_K2O4oYM7el8cSXnqZrB7EQ_WDXYWkn_";
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const BASE_URL = "https://uous-audio-player.s3.eu-west-1.amazonaws.com/";

/* =========================
   DATA LOADER
========================= */

async function loadFiles() {
  const res = await fetch(BASE_URL + "files.json", { cache: "no-cache" });
  return res.json();
}

function makeTrackId(playlist, file) {
  return `${playlist}/${file}`;
}

/* =========================
   SUPABASE
========================= */

async function loadComments(track) {
  const { data } = await supabase
    .from("comments")
    .select("*")
    .eq("track", track);

  return data || [];
}

async function saveComment(track, line, value) {
  await supabase
    .from("comments")
    .upsert(
      { track, line, comment: value },
      { onConflict: "track,line" }
    );
}

/* =========================
   UI COMPONENT
========================= */

function createInput(track, line, existing) {
  const input = document.createElement("input");
  input.className = "comment";
  input.value = existing?.comment || "";
  input.placeholder = `comment ${line + 1}`;

  input.addEventListener("change", () => {
    saveComment(track, line, input.value);
  });

  return input;
}

/* =========================
   RENDER (UNCHANGED FLOW)
========================= */

async function render() {
  const app = document.getElementById("app");
  const data = await loadFiles();

  for (const playlist of data) {

    const playlistDiv = document.createElement("div");
    playlistDiv.className = "playlist";

    const title = document.createElement("div");
    title.className = "playlist-title";
    title.textContent = playlist.playlist;

    playlistDiv.appendChild(title);

    for (const track of playlist.tracks) {

      const trackId = makeTrackId(playlist.playlist, track.file);
      const comments = await loadComments(trackId);

      const trackDiv = document.createElement("div");
      trackDiv.className = "track";

      const name = document.createElement("div");
      name.className = "track-name";
      name.textContent = track.title;

      trackDiv.appendChild(name);

      for (let i = 0; i < 4; i++) {
        const existing = comments.find(c => c.line === i);
        trackDiv.appendChild(createInput(trackId, i, existing));
      }

      playlistDiv.appendChild(trackDiv);
    }

    app.appendChild(playlistDiv);
  }
}

render();

</script>

</body>
</html>
