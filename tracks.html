<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>tracks</title>
  <script src="https://unpkg.com/wavesurfer.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    /* === KEEP YOUR EXISTING STYLES EXACTLY === */

    body {
      margin: 0;
      background-color: white;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: center top no-repeat white;
      background-image: url('https://classicvinyl.github.io/audio-player/uous-bg.jpg');
      background-size: contain;
      z-index: -2;
      pointer-events: none;
    }

    @media (max-width: 768px) {
      body::before {
        background-size: cover;
      }
    }

    body::after {
      content: "";
      position: fixed;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.3);
      z-index: -1;
    }

    .playlist-container {
      background-color: #000;
      padding: 1rem;
      border-radius: 0.5rem;
      margin-bottom: 2rem;
    }

    .playlist-title {
      color: grey;
      font-weight: bold;
      font-size: 2rem;
    }

    .track-item {
      padding: 0.5rem 1rem;
      color: white;
    }

    .duration {
      color: #bbb;
      font-size: 0.85rem;
    }

    .comment-box {
      width: 100%;
      background: #111;
      color: #ccc;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 4px 6px;
      font-size: 0.85rem;
      margin-top: 4px;
    }
  </style>
</head>

<body>
<div class="p-6">
  <h2 class="playlist-title mb-4">TRACKS</h2>
  <div id="playlist-selector"></div>
  <div id="active-playlist"></div>
</div>

<script>
const BASE_URL = 'https://uous-audio-player.s3.eu-west-1.amazonaws.com/';

async function loadFiles() {
  const res = await fetch(BASE_URL + 'files.json', {cache: 'no-cache'});
  return res.json();
}

/* ===== COMMENT STORAGE ===== */

function getCommentKey(track, line) {
  return `comment_${track}_${line}`;
}

function saveComment(track, line, value) {
  localStorage.setItem(getCommentKey(track, line), value);
}

function loadComment(track, line) {
  return localStorage.getItem(getCommentKey(track, line)) || '';
}

/* ===== PLAYLIST ===== */

function createPlaylist(name, tracks) {

  const container = document.createElement('div');
  container.className = 'playlist-container';

  const title = document.createElement('h2');
  title.className = 'playlist-title mb-4';
  title.textContent = name;
  container.appendChild(title);

  const trackList = document.createElement('div');

  tracks.forEach(track => {

    const trackDiv = document.createElement('div');
    trackDiv.className = 'mb-4';

    const header = document.createElement('div');
    header.className = 'track-item flex justify-between';

    const nameSpan = document.createElement('span');
    nameSpan.textContent = track.title;

    const audio = new Audio(BASE_URL + track.file);

    const durationSpan = document.createElement('span');
    durationSpan.className = 'duration';
    durationSpan.textContent = '--:--';

    audio.addEventListener('loadedmetadata', () => {
      const mins = Math.floor(audio.duration / 60);
      const secs = Math.floor(audio.duration % 60).toString().padStart(2, '0');
      durationSpan.textContent = `${mins}:${secs}`;
    });

    header.appendChild(nameSpan);
    header.appendChild(durationSpan);

    trackDiv.appendChild(header);

    /* ===== COMMENTS ===== */

    for (let i = 1; i <= 4; i++) {
      const input = document.createElement('input');
      input.className = 'comment-box';
      input.placeholder = `comment ${i}`;

      input.value = loadComment(track.title, i);

      input.addEventListener('input', () => {
        saveComment(track.title, i, input.value);
      });

      trackDiv.appendChild(input);
    }

    trackList.appendChild(trackDiv);
  });

  container.appendChild(trackList);

  return container;
}

/* ===== INIT ===== */

async function init() {
  const files = await loadFiles();
  const selector = document.getElementById('playlist-selector');
  const active = document.getElementById('active-playlist');

  files.forEach(p => {
    const btn = document.createElement('div');
    btn.className = 'track-item';
    btn.textContent = p.playlist;

    btn.onclick = () => {
      active.innerHTML = '';
      active.appendChild(createPlaylist(p.playlist, p.tracks));
    };

    selector.appendChild(btn);
  });
}

init();
</script>
</body>
</html>
