<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>uous private</title>
  <script src="https://unpkg.com/wavesurfer.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>

body {
  margin: 0;
  background-color: white;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: center top no-repeat white;
  background-image: url('https://classicvinyl.github.io/audio-player/uous-bg.jpg');
  background-size: contain;
  z-index: -2;
  pointer-events: none;
}

@media (max-width: 768px) {
  body::before {
    background-size: cover;
  }
}

body::after {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.3);
  z-index: -1;
  pointer-events: none;
}

    .playlist-container {
      background-color: #000;
      padding: 1rem;
      border-radius: 0.5rem;
      border-color: #808080;
      margin-bottom: 2rem;
    }
    .playlist-title {
      color: grey;
      font-weight: bold;
      font-size: 2rem;
      margin: 0;
    }
    .track-item {
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      color: white;
      transition: background-color 0.3s;
    }
    .track-item:hover {
      background-color: #3c2a36;
    }
    .track-item.active {
      background-color: grey;
      font-weight: bold;
    }
    .duration {
      color: #bbb;
      font-size: 0.85rem;
      min-width: 40px;
      text-align: right;
      margin-left: 0.5rem;
    }
    .waveform-container {
      position: relative;
      height: 130px;
      margin-bottom: 0.5rem;
      background-color: #000;
      border-radius: 0.5rem;
      border-color: #808080;
      transition: opacity 0.3s ease;
    }
    .error-message {
      color: #ff6b6b;
      font-weight: bold;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .play-pause-button {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: orange;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.3s;
      flex-shrink: 0;
    }
    .play-icon, .pause-icon {
      fill: white;
      width: 30px;
      height: 30px;
    }
    .playlist-link {
      color: white;
      cursor: pointer;
      padding: 0.25rem 0;
      display: block;
    }

    .playlist-container .flex.flex-wrap {
      flex-wrap: nowrap !important;
      align-items: center;
      gap: 0.5rem;
    }
    .playlist-container .playlist-title {
      flex: 1 1 auto;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-right: 0.5rem;
    }
    .playlist-container .play-pause-button {
      flex: 0 0 auto;
    }
    .track-item .truncate {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (max-width: 480px) {
      .playlist-container .playlist-title {
        font-size: 1.25rem;
      }
      .playlist-container .play-pause-button {
        width: 44px;
        height: 44px;
      }
    }

    /* ── COMMENTS PANEL ── */
    .comments-panel {
      background-color: #111;
      border-radius: 0.5rem;
      padding: 1rem;
      margin-top: 0.75rem;
      border: 1px solid #333;
    }
    .comments-panel h3 {
      color: grey;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0 0 0.75rem 0;
      font-weight: 600;
    }
    .comment-row {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin-bottom: 0.6rem;
    }
    .comment-label {
      color: orange;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-width: 52px;
      padding-top: 0.45rem;
      flex-shrink: 0;
    }
    .comment-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 0.3rem;
      color: #ddd;
      font-size: 0.8rem;
      padding: 0.35rem 0.5rem;
      resize: none;
      min-height: 34px;
      line-height: 1.4;
      font-family: inherit;
      transition: border-color 0.2s;
      overflow: hidden;
    }
    .comment-input:focus {
      outline: none;
      border-color: orange;
    }
    .comment-input::placeholder {
      color: #555;
    }
    .comment-save-btn {
      background: orange;
      border: none;
      border-radius: 0.25rem;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.3rem 0.55rem;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 0.3rem;
      transition: background 0.2s, opacity 0.2s;
      align-self: flex-start;
    }
    .comment-save-btn:hover {
      background: #cc8400;
    }
    .comment-save-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .comment-status {
      font-size: 0.65rem;
      color: #666;
      margin-top: 0.15rem;
      min-height: 0.9rem;
    }
    .comment-status.ok  { color: #6c6; }
    .comment-status.err { color: #f66; }

    /* auto-resize textarea helper */
    .comment-input {
      field-sizing: content; /* modern browsers */
    }
  </style>
</head>
<body>
  <div class="p-6">
    <h2 id="playlists-header" class="playlist-title mb-2">PLAYLISTS</h2>
    <div id="playlist-selector" class="mb-8 space-y-2"></div>
    <div id="active-playlist"></div>
    <div id="other-playlists" class="mt-12 space-y-2"></div>

    <h2 id="gdrive-header" class="playlist-title mt-12 mb-2">GOOGLE DRIVE</h2>
    <div id="gdrive-links" class="space-y-2">
      <div class="track-item active flex-nowrap overflow-hidden" style="cursor:pointer;" onclick="window.open('https://drive.google.com/drive/folders/1bh24cYAMnM0BKLjZKJOcvF5nxqXxLoc3', '_blank')">
        <span class="truncate w-full">CONTENTS</span>
      </div>
    </div>
<br><br>
    <h2 id="soundcloud-header" class="playlist-title mt-12 mb-2">SOUNDCLOUD</h2>
    <div id="soundcloud-links" class="space-y-2">
      <div class="track-item active flex-nowrap overflow-hidden" style="cursor:pointer;" onclick="window.open('https://soundcloud.com/decal-artifacts/sets/bbas-session-1/s-44DPp00XrD8?ref=clipboard&p=a&c=1&si=a00b89a1ec864ebcbe55e9d3151af801', '_blank')">
        <span class="truncate w-full">SESSION 1</span>
      </div>
      <div class="track-item active flex-nowrap overflow-hidden" style="cursor:pointer;" onclick="window.open('https://soundcloud.com/decal-artifacts/sets/jabbs-session-2/s-NJxU5P7U5WY?ref=clipboard&p=a&c=1&si=fbba604ec4d74561bba2e933e031e135', '_blank')">
        <span class="truncate w-full">SESSION 2</span>
      </div>
      <div class="track-item active flex-nowrap overflow-hidden" style="cursor:pointer;" onclick="window.open('https://soundcloud.com/decal-artifacts/sets/uous-may-2025-edited/s-Se2jSTtvQRn?ref=clipboard&p=a&c=1&si=76e10ada55c34aa9a1a9b0c8f3250b8c', '_blank')">
        <span class="truncate w-full">MAY-2025</span>
      </div>
    </div>
  </div>

  <script>
    // ── Supabase client ──────────────────────────────────────────────────────
    const { createClient } = supabase;
    const sb = createClient(
      'https://mgeeyekokpymfwtkngai.supabase.co',
      'sb_publishable_K2O4oYM7el8cSXnqZrB7EQ_WDXYWkn_'
    );

    const MEMBERS = [
      { name: 'Alan',   line: 1 },
      { name: 'Barry',  line: 2 },
      { name: 'Bryan',  line: 3 },
      { name: 'Stephen',line: 4 },
    ];

    // ── Comments panel ───────────────────────────────────────────────────────
    function createCommentsPanel(trackKey) {
      const panel = document.createElement('div');
      panel.className = 'comments-panel';

      const heading = document.createElement('h3');
      heading.textContent = 'notes';
      panel.appendChild(heading);

      // For each member, create a row with label + textarea + save btn + status
      MEMBERS.forEach(member => {
        const row = document.createElement('div');
        row.className = 'comment-row';

        const label = document.createElement('div');
        label.className = 'comment-label';
        label.textContent = member.name;
        row.appendChild(label);

        const inner = document.createElement('div');
        inner.style.cssText = 'flex:1; display:flex; flex-direction:column; gap:0.2rem;';

        const textarea = document.createElement('textarea');
        textarea.className = 'comment-input';
        textarea.rows = 1;
        textarea.placeholder = '—';
        textarea.dataset.original = '';
        inner.appendChild(textarea);

        const status = document.createElement('div');
        status.className = 'comment-status';
        inner.appendChild(status);

        row.appendChild(inner);

        const btn = document.createElement('button');
        btn.className = 'comment-save-btn';
        btn.textContent = 'save';
        btn.disabled = true;
        row.appendChild(btn);

        panel.appendChild(row);

        // Enable save only when content changes
        textarea.addEventListener('input', () => {
          btn.disabled = textarea.value.trim() === textarea.dataset.original.trim();
          status.textContent = '';
          status.className = 'comment-status';
        });

        // Save handler — upsert by track + line
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          status.textContent = 'saving…';
          status.className = 'comment-status';

          const { error } = await sb
            .from('comments')
            .upsert(
              { track: trackKey, line: member.line, comment: textarea.value.trim() },
              { onConflict: 'track,line' }
            );

          if (error) {
            status.textContent = 'error saving';
            status.className = 'comment-status err';
            btn.disabled = false;
          } else {
            textarea.dataset.original = textarea.value.trim();
            status.textContent = 'saved ✓';
            status.className = 'comment-status ok';
          }
        });

        // Load existing comment for this track + member
        (async () => {
          const { data, error } = await sb
            .from('comments')
            .select('comment')
            .eq('track', trackKey)
            .eq('line', member.line)
            .maybeSingle();

          if (!error && data) {
            textarea.value = data.comment || '';
            textarea.dataset.original = textarea.value;
          }
        })();
      });

      return panel;
    }

    // ── Audio player ─────────────────────────────────────────────────────────
    const BASE_URL = 'https://uous-audio-player.s3.eu-west-1.amazonaws.com/';
    let globalWavesurfer = null;

    async function loadFiles() {
      const res = await fetch(BASE_URL + 'files.json', { cache: 'no-cache' });
      return res.json();
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function createPlayPauseSVG(isPlaying) {
      return isPlaying
        ? `<svg class="pause-icon" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect></svg>`
        : `<svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>`;
    }

    function createPlaylist(name, tracks) {
      if (globalWavesurfer) {
        try { globalWavesurfer.stop(); globalWavesurfer.unAll(); globalWavesurfer.destroy(); } catch {}
        globalWavesurfer = null;
      }

      const container = document.createElement('div');
      container.className = 'playlist-container';

      tracks.sort((a, b) => {
        function tokenize(str) {
          return str.match(/\d+|\D+/g).map(token =>
            /\d/.test(token) ? parseInt(token, 10) : token.toLowerCase()
          );
        }
        const aTokens = tokenize(a.title);
        const bTokens = tokenize(b.title);
        const len = Math.max(aTokens.length, bTokens.length);
        for (let i = 0; i < len; i++) {
          const aTok = aTokens[i];
          const bTok = bTokens[i];
          if (aTok === undefined) return -1;
          if (bTok === undefined) return 1;
          if (aTok < bTok) return -1;
          if (aTok > bTok) return 1;
        }
        return 0;
      });

      const header = document.createElement('div');
      header.className = 'flex flex-wrap justify-between items-center gap-2 mb-4';

      const title = document.createElement('h2');
      title.className = 'playlist-title m-0';
      title.textContent = name;
      header.appendChild(title);

      const playPauseButton = document.createElement('div');
      playPauseButton.className = 'play-pause-button ml-auto';
      playPauseButton.innerHTML = createPlayPauseSVG(false);
      header.appendChild(playPauseButton);

      container.appendChild(header);

      const waveformContainer = document.createElement('div');
      waveformContainer.className = 'waveform-container';
      container.appendChild(waveformContainer);

      const errorMessage = document.createElement('div');
      errorMessage.className = 'error-message';
      errorMessage.style.display = 'none';
      container.appendChild(errorMessage);

      const trackList = document.createElement('ul');
      trackList.className = 'space-y-2';
      container.appendChild(trackList);

      let currentTrackIndex = -1;
      let isPlaying = false;
      let currentLoadTimeout = null;
      let currentAttempt = 0;
      const MAX_RETRIES = 5;
      const LOAD_TIMEOUT = 20000;

      let loadingPromise = Promise.resolve();

      // Track which comments panel is open
      let openCommentsPanel = null;
      let openCommentsIndex = -1;

      function clearWavesurfer() {
        if (globalWavesurfer) {
          try { globalWavesurfer.stop(); globalWavesurfer.unAll(); globalWavesurfer.destroy(); } catch {}
          globalWavesurfer = null;
        }
      }

      function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

      function setErrorMessage(text) {
        errorMessage.textContent = text;
        errorMessage.style.display = text ? 'block' : 'none';
      }

      async function loadTrack(index) {
        if (index < 0 || index >= tracks.length) return;

        loadingPromise = loadingPromise.then(async () => {
          if (currentLoadTimeout) { clearTimeout(currentLoadTimeout); currentLoadTimeout = null; }

          if (globalWavesurfer) { clearWavesurfer(); await delay(150); }

          currentTrackIndex = index;
          currentAttempt = 1;
          let didLoad = false;

          waveformContainer.style.opacity = '0.3';

          globalWavesurfer = WaveSurfer.create({
            container: waveformContainer,
            waveColor: 'white',
            progressColor: 'orange',
            height: 130,
            responsive: true,
            backend: 'MediaElement'
          });

          function retryLoad() {
            if (currentAttempt < MAX_RETRIES) {
              currentAttempt++;
              loadTrack(index);
            } else {
              waveformContainer.style.opacity = '1';
              setErrorMessage('Error: Unable to load track after multiple attempts.');
            }
          }

          currentLoadTimeout = setTimeout(() => {
            if (!didLoad) retryLoad();
          }, LOAD_TIMEOUT);

          const waveformJSONUrl = BASE_URL + tracks[index].file.replace(/\.mp3$/, '.json');
          try {
            const response = await fetch(waveformJSONUrl);
            if (!response.ok) throw new Error('Waveform JSON not found');
            const waveformData = await response.json();
            const rawData = waveformData.data;
            const flatData = Array.isArray(rawData) ? rawData.flat(Infinity) : [];
            const peaks = flatData.map(v => v / 255);

            if (!peaks || peaks.length === 0) throw new Error('Peaks array empty or invalid');

            globalWavesurfer.once('ready', () => {
              didLoad = true;
              clearTimeout(currentLoadTimeout);
              setTimeout(() => {
                waveformContainer.style.opacity = '1';
                globalWavesurfer.play();
                isPlaying = true;
                updatePlayPauseButton();
                updateActiveTrack();
                setErrorMessage('');
              }, 200);
            });

            globalWavesurfer.once('error', () => { clearTimeout(currentLoadTimeout); retryLoad(); });

            globalWavesurfer.on('finish', () => {
              let nextIndex = currentTrackIndex + 1;
              if (nextIndex < tracks.length) {
                loadTrack(nextIndex);
              } else {
                isPlaying = false;
                updatePlayPauseButton();
                updateActiveTrack();
              }
            });

            globalWavesurfer.load(BASE_URL + tracks[index].file, peaks);
          } catch (err) {
            retryLoad();
          }
        });
      }

      function updateActiveTrack() {
        trackList.querySelectorAll('li').forEach((el, i) => {
          el.classList.toggle('active', i === currentTrackIndex);
        });
      }

      function updatePlayPauseButton() {
        playPauseButton.innerHTML = createPlayPauseSVG(isPlaying);
      }

      playPauseButton.addEventListener('click', () => {
        if (!globalWavesurfer) return;
        if (isPlaying) {
          globalWavesurfer.pause();
          isPlaying = false;
        } else {
          globalWavesurfer.play();
          isPlaying = true;
        }
        updatePlayPauseButton();
      });

      tracks.forEach((track, index) => {
        const listItem = document.createElement('li');
        listItem.className = 'track-item flex-nowrap overflow-hidden';
        listItem.style.flexDirection = 'column';
        listItem.style.alignItems = 'stretch';
        listItem.style.cursor = 'default';

        // Top row: track name + duration + comment toggle
        const topRow = document.createElement('div');
        topRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding: 0;';

        const nameSpan = document.createElement('span');
        nameSpan.textContent = track.title;
        nameSpan.className = 'truncate pr-2';
        nameSpan.style.flex = '1';
        topRow.appendChild(nameSpan);

        const durationSpan = document.createElement('span');
        durationSpan.className = 'duration';
        durationSpan.textContent = '--:--';
        topRow.appendChild(durationSpan);

        // Comment toggle button
        const commentToggle = document.createElement('button');
        commentToggle.title = 'Notes';
        commentToggle.style.cssText = `
          background: none; border: none; cursor: pointer;
          color: #555; margin-left: 0.5rem; padding: 0;
          font-size: 0.85rem; line-height: 1; flex-shrink: 0;
          transition: color 0.2s;
        `;
        commentToggle.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>`;
        topRow.appendChild(commentToggle);

        listItem.appendChild(topRow);

        // Comment panel placeholder
        let commentsEl = null;
        let panelOpen = false;

        // Play on track name/duration click
        topRow.addEventListener('click', (e) => {
          if (e.target === commentToggle || commentToggle.contains(e.target)) return;
          if (currentTrackIndex === index && isPlaying) {
            globalWavesurfer.pause();
            isPlaying = false;
            updatePlayPauseButton();
          } else {
            loadTrack(index);
          }
          updatePlayPauseButton();
          updateActiveTrack();
        });

        // Toggle comments panel
        commentToggle.addEventListener('click', (e) => {
          e.stopPropagation();
          panelOpen = !panelOpen;
          commentToggle.style.color = panelOpen ? 'orange' : '#555';

          if (panelOpen) {
            // Use track filename as the unique key (strip path/ext)
            const trackKey = track.file.replace(/^.*\//, '').replace(/\.[^.]+$/, '');
            commentsEl = createCommentsPanel(trackKey);
            listItem.appendChild(commentsEl);
          } else {
            if (commentsEl) { commentsEl.remove(); commentsEl = null; }
          }
        });

        // Duration
        const audio = new Audio(BASE_URL + track.file);
        audio.addEventListener('loadedmetadata', () => {
          durationSpan.textContent = formatTime(audio.duration);
        });

        trackList.appendChild(listItem);
      });

      return container;
    }

    async function init() {
      const files = await loadFiles();
      const selector = document.getElementById('playlist-selector');
      const activeContainer = document.getElementById('active-playlist');
      const otherContainer = document.getElementById('other-playlists');
      const playlistsHeader = document.getElementById('playlists-header');
      const gdriveHeader = document.getElementById('gdrive-header');
      const gdriveLinks = document.getElementById('gdrive-links');
      const soundcloudHeader = document.getElementById('soundcloud-header');
      const soundcloudLinks = document.getElementById('soundcloud-links');

      files.forEach((playlist) => {
        const button = document.createElement('div');
        button.className = 'track-item active flex-nowrap overflow-hidden';
        button.style.cursor = 'pointer';

        const nameSpan = document.createElement('span');
        nameSpan.textContent = playlist.playlist;
        nameSpan.className = 'truncate w-full';
        button.appendChild(nameSpan);

        button.addEventListener('click', () => {
          playlistsHeader.style.display = 'none';
          gdriveHeader.style.display = 'none';
          gdriveLinks.style.display = 'none';
          soundcloudHeader.style.display = 'none';
          soundcloudLinks.style.display = 'none';
          selector.innerHTML = '';
          activeContainer.innerHTML = '';
          otherContainer.innerHTML = '';

          const active = createPlaylist(playlist.playlist, playlist.tracks);
          activeContainer.appendChild(active);

          const homeLink = document.createElement('div');
          homeLink.className = 'track-item active inline-block px-4 py-2 rounded';
          homeLink.style.cursor = 'pointer';
          const homeText = document.createElement('span');
          homeText.textContent = 'HOME';
          homeText.className = 'truncate px-4 py-2';
          homeLink.appendChild(homeText);

          homeLink.addEventListener('click', () => location.reload());
          otherContainer.appendChild(homeLink);
        });

        selector.appendChild(button);
      });
    }

    init();
  </script>
</body>
</html>
